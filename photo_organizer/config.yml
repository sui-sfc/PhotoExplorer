# 写真が置かれているソースディレクトリ
source_directory: 'photos/source'

# 整理後の写真を保存するディレクトリ
destination_directory: 'photos/organized'

# 重複した写真を移動するディレクトリ
duplicate_directory: 'photos/duplicates'

# 整理後のディレクトリ構造を定義するパターン
# 使用可能なプレースホルダー: {YYYY}, {MM}, {DD}, {Make}, {Model}, {LensModel}
directory_pattern: '{YYYY}/{MM}/{Make}_{Model}'

# 重複ファイルが見つかった場合の処理: 'move' (移動), 'delete' (削除), 'skip' (何もしない)
on_duplicate: 'move'
