name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      commit_screenshots:
        description: "README 用スクリーンショットを撮り直してコミットする"
        type: boolean
        default: true
      release:
        description: "Releases に exe を公開する（バージョンは csproj の Version）"
        type: boolean
        default: false

permissions:
  contents: write

env:
  PE_REQUIRE_EXIFTOOL: "1"

jobs:
  test-linux:
    name: テスト (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: exiftool をインストール
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - name: テスト
        run: dotnet test PhotoExplorer.Tests/PhotoExplorer.Tests.csproj -c Release --logger "console;verbosity=normal"

  windows:
    name: ビルド・テスト・発行 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: exiftool をインストール
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            choco install exiftool -y --no-progress
            $exe = Get-ChildItem "C:/ProgramData/chocolatey/lib/exiftool" -Recurse -Include "exiftool.exe", "exiftool(-k).exe" -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -notmatch "\\shims?\\" } | Select-Object -First 1
            if ($exe) { break }
            Start-Sleep -Seconds 10
          }
          if (-not $exe) { throw "exiftool をインストールできませんでした" }
          $dir = $exe.DirectoryName
          if ($exe.Name -ne "exiftool.exe") { Copy-Item $exe.FullName (Join-Path $dir "exiftool.exe") }
          Add-Content $env:GITHUB_PATH $dir
          Add-Content $env:GITHUB_ENV "EXIFTOOL_DIR=$dir"
          & (Join-Path $dir "exiftool.exe") -ver
      - name: ビルド
        run: dotnet build PhotoExplorer.sln -c Release
      - name: テスト
        run: dotnet test PhotoExplorer.Tests/PhotoExplorer.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
      - name: 発行（単一 exe）
        run: dotnet publish PhotoExplorer/PhotoExplorer.csproj -c Release -o publish
      - name: exiftool を同梱
        shell: pwsh
        run: |
          # 展開してすぐ使えるよう、exiftool.exe と exiftool_files を Resources に入れる
          New-Item -ItemType Directory -Force publish/Resources | Out-Null
          Copy-Item (Join-Path $env:EXIFTOOL_DIR "exiftool.exe") publish/Resources/
          $files = Join-Path $env:EXIFTOOL_DIR "exiftool_files"
          if (Test-Path $files) { Copy-Item $files publish/Resources/ -Recurse }
          Get-ChildItem publish -Recurse -Depth 1 | Select-Object FullName
      - uses: actions/upload-artifact@v7
        with:
          name: PhotoExplorer-win-x64
          path: publish/

      - name: リリースを作成（コミットメッセージに [release] を含むとき、または手動実行で指定したとき）
        if: (github.event_name == 'workflow_dispatch' && inputs.release) || contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "v" + ([xml](Get-Content PhotoExplorer/PhotoExplorer.csproj)).Project.PropertyGroup[0].Version
          Compress-Archive -Path publish/* -DestinationPath PhotoExplorer-win-x64.zip
          $notes = @"
          ## ダウンロード
          下の **PhotoExplorer-win-x64.zip** をダウンロードして展開し、``PhotoExplorer.exe`` をダブルクリックしてください。

          - .NET のインストールは不要です
          - exiftool も同梱しています（``Resources`` フォルダ）
          - 「Windows によって PC が保護されました」と表示されたら「詳細情報」→「実行」を押してください
          "@
          gh release view $version *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $version PhotoExplorer-win-x64.zip --clobber
          } else {
            gh release create $version PhotoExplorer-win-x64.zip --target $env:GITHUB_SHA --title "PhotoExplorer $version" --notes $notes --latest
          }

      - name: スクリーンショットを作成
        timeout-minutes: 10
        shell: pwsh
        run: |
          $out = Join-Path $PWD "docs/images"
          $p = Start-Process -FilePath "publish/PhotoExplorer.exe" -ArgumentList "--screenshots", "`"$out`"" -PassThru -Wait
          Get-ChildItem $out
          if (Test-Path "$out/screenshot-error.txt") { Get-Content "$out/screenshot-error.txt"; exit 1 }
          exit $p.ExitCode
      - name: 位置情報の読み取りを確認
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          exiftool -ver
          exiftool -api geolocation -n -s -GPSLatitude -GPSLongitude -GeolocationCity -GeolocationCountry -r -ext jpg "C:/PhotoExplorerDemo/Pictures" | Select-Object -First 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: docs/images/
      - name: スクリーンショットをコミット
        if: github.event_name == 'workflow_dispatch' && inputs.commit_screenshots || contains(github.event.head_commit.message, '[screenshots]')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/*.png
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "docs: README のスクリーンショットを更新 [skip ci]"
            git pull --rebase origin $env:GITHUB_REF_NAME
            git push origin HEAD:$env:GITHUB_REF_NAME
          }
